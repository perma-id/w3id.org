# Overlay for running the official httpd:2.4 image with no build step.
#
# Unlike conf/httpd.conf, this file does not replace the image's stock
# configuration -- it is appended to it, with a single directive:
#
#   httpd -D FOREGROUND -c "Include /w3id/conf/docker-direct.conf"
#
# See the "Without building an image" section of
# docs/guides/local-server.md for the full command.
#
# KNOWN LIMITATION. Because the stock httpd.conf still runs first, this path
# does NOT give you the restricted module set that conf/httpd.conf does: the
# image's defaults may load modules the live server does not have. So an
# .htaccess that works under this path could still fail in production. Use it
# to get a server up quickly; use the built image (docker compose up) when you
# want the local server to agree with the real one about what is available.

# Every LoadModule below is guarded, because the stock configuration already
# enables some of them and loading a module twice is an error worth avoiding.
# mod_rewrite is the one that is always needed: the image ships it as a .so
# but leaves it commented out, which is why an unconfigured container silently
# ignores every rewrite rule in the tree.

<IfModule !rewrite_module>
  LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !headers_module>
  LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !setenvif_module>
  LoadModule setenvif_module modules/mod_setenvif.so
</IfModule>
<IfModule !env_module>
  LoadModule env_module modules/mod_env.so
</IfModule>
<IfModule !mime_module>
  LoadModule mime_module modules/mod_mime.so
</IfModule>
<IfModule !dir_module>
  LoadModule dir_module modules/mod_dir.so
</IfModule>
<IfModule !alias_module>
  LoadModule alias_module modules/mod_alias.so
</IfModule>
<IfModule !autoindex_module>
  LoadModule autoindex_module modules/mod_autoindex.so
</IfModule>
<IfModule !negotiation_module>
  LoadModule negotiation_module modules/mod_negotiation.so
</IfModule>
<IfModule !access_compat_module>
  LoadModule access_compat_module modules/mod_access_compat.so
</IfModule>
<IfModule !authz_core_module>
  LoadModule authz_core_module modules/mod_authz_core.so
</IfModule>
<IfModule !authz_host_module>
  LoadModule authz_host_module modules/mod_authz_host.so
</IfModule>
<IfModule !deflate_module>
  LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !filter_module>
  LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !reqtimeout_module>
  LoadModule reqtimeout_module modules/mod_reqtimeout.so
</IfModule>

# The stock configuration sets AllowOverride None on this directory. The
# <Directory> block in w3id.conf names the same path and comes later, so it
# wins -- confirmed by running it, not assumed: rewrite rules under the mounted
# tree do fire this way.
Define W3ID_DOCROOT /usr/local/apache2/htdocs

Include /w3id/conf/w3id.conf
