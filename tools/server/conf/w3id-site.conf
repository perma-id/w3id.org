# Native Debian/Ubuntu apache2 wrapper.
#
# Copy or symlink this into /etc/apache2/sites-available/ and enable it with
# `a2ensite w3id-site`. It supplies only what is specific to the Debian layout
# -- the listener, the virtual host, and Debian's log paths -- and includes
# conf/w3id.conf for the actual w3id.org behaviour.
#
# EDIT THE PATH BELOW. Everything else should work unchanged.
#
# See the "With a native Apache" section of docs/guides/local-server.md for
# the modules to enable first. This file assumes they are already on: without
# mod_rewrite in particular, every rule in the tree is silently ignored.

# The absolute path of your checkout of this repository -- the directory that
# contains ids/, not ids/ itself.
Define W3ID_REPO /srv/w3id.org

Define W3ID_DOCROOT ${W3ID_REPO}/ids

# Port 8080 is what every curl example in the documentation uses. If Apache
# refuses to start with "Address already in use", your /etc/apache2/ports.conf
# is probably listening on 8080 as well -- remove one of the two.
Listen 8080

<VirtualHost *:8080>
  # Deliberately NOT reproduced from production: the live *:80 virtual host is
  # a blanket `Redirect permanent / https://w3id.org/`. Copied here it would
  # bounce every one of your test requests to the real service, and you would
  # be testing the deployed rules rather than your own.
  #
  # Rewrite behaviour does not depend on the scheme, so plain HTTP tests the
  # same rules. The guide's TLS section covers adding a certificate if you
  # specifically need to check HTTPS.

  Include ${W3ID_REPO}/tools/server/conf/w3id.conf

  ErrorLog ${APACHE_LOG_DIR}/w3id-local-error.log
  CustomLog ${APACHE_LOG_DIR}/w3id-local-access.log combined

  # A syntax error in an .htaccess produces a 500 for every URL under that
  # directory, and only the error log names the file and the line. Raise this
  # to `info` if a rule is not matching and you cannot see why -- mod_rewrite
  # then logs each rewrite it attempts:
  #   LogLevel warn rewrite:trace3
  LogLevel warn
</VirtualHost>
