# Shared w3id.org server behaviour.
#
# This file holds everything that defines how w3id.org behaves, and nothing
# about where Apache keeps its files. Both supported ways of running the
# service locally include it verbatim:
#
#   - conf/httpd.conf      the container, using the upstream layout
#   - conf/w3id-site.conf  a native Debian/Ubuntu apache2, in sites-available/
#
# One copy is the point. Two hand-maintained configs would drift, and a local
# server that behaves differently from the real one is worse than no local
# server at all -- it produces confident, wrong answers.
#
# The including wrapper must Define W3ID_DOCROOT as the absolute path of the
# repository's ids/ directory. Every directive below is valid in both server
# config and virtual host context, which is what lets one file serve both.
#
# Mirrored from the live single-server configuration. Departures from it are
# marked LOCAL ONLY and explained; anything unmarked is production behaviour.
#
# What the live virtual host has that this deliberately does not:
#
#   Redirect / to https      would send every local test to the real service
#   SSLEngine and the certs  no TLS by default; see the guide's TLS section
#   Strict-Transport-Security meaningless without TLS, and harmful to set on
#                            localhost, where it would outlive this container
#   ScriptAlias /cgi-bin/    nothing on the service is CGI
#   SSLOptions +StdEnvVars   follows from having no TLS and no CGI
#   BrowserMatch "MSIE ..."  workarounds for browsers no longer in use
#   ServerAdmin              an address on a local error page misleads
#   mpm_event tuning         concurrency limits are irrelevant to one tester
#
# Everything in that list is a production concern rather than a behavioural
# one: none of it changes how a rewrite rule resolves. The exception worth
# knowing is TLS, and rewrite rules do not behave differently by scheme unless
# they test %{HTTPS} or %{SERVER_PORT} themselves.

DocumentRoot "${W3ID_DOCROOT}"

# ---------------------------------------------------------------------------
# Response headers
# ---------------------------------------------------------------------------

# The service is read by scripts from arbitrary origins, so every response is
# CORS-open. Note that hundreds of .htaccess files set this header themselves
# too, so a response can carry it from either place.
Header always set Access-Control-Allow-Origin "*"

# Strip validators from redirects and errors. A 302 carrying an ETag or a
# Last-Modified invites a cache to revalidate a response whose body is not
# worth revalidating.
Header unset ETag "expr=%{REQUEST_STATUS} >= 300"
Header unset Last-Modified "expr=%{REQUEST_STATUS} >= 300"
Header unset Accept-Ranges "expr=%{REQUEST_STATUS} >= 300"

# ---------------------------------------------------------------------------
# Error and redirect bodies
# ---------------------------------------------------------------------------

# These paths resolve inside the document root: ids/w3id/ holds all four
# pages. A redirect gets a human-readable body explaining what happened, for
# the rare client that shows it.
ErrorDocument 301 /w3id/3xx.html
ErrorDocument 302 /w3id/3xx.html
ErrorDocument 303 /w3id/3xx.html
ErrorDocument 307 /w3id/3xx.html
ErrorDocument 308 /w3id/3xx.html
ErrorDocument 400 /w3id/400.html
ErrorDocument 403 /w3id/403.html
ErrorDocument 404 /w3id/404.html

# ---------------------------------------------------------------------------
# The document root
# ---------------------------------------------------------------------------

# Deny everything by default, then open the one tree that is meant to be
# served. A path typo in W3ID_DOCROOT then fails closed rather than exposing
# the filesystem.
<Directory />
  Options FollowSymLinks
  AllowOverride None
  Require all denied
</Directory>

<Directory "${W3ID_DOCROOT}">
  # Indexes, FollowSymLinks and MultiViews all match production. MultiViews in
  # particular is load-bearing for fidelity: it is why so many .htaccess files
  # defensively write `Options -MultiViews`, and a local server without it
  # would silently disagree with the live one.
  Options Indexes FollowSymLinks MultiViews

  # AllowOverride All is required, not merely convenient. Per-directory
  # .htaccess files ARE the service -- and a handful of them use <IfModule>,
  # <If> and <Files>, which no narrower override class permits.
  AllowOverride All

  # Production spells this with the 2.2-era `Order allow,deny` / `allow from
  # all`. This is the 2.4 equivalent and behaves identically. mod_access_compat
  # is still loaded, so an .htaccess using the old spelling keeps working here
  # exactly as it does live.
  Require all granted
</Directory>

# The document root is a git working tree. Nothing under .git is ever served,
# whatever a stray .htaccess or a symlink might otherwise permit.
#
# The dot is escaped here; the live server writes "/.git", where the unescaped
# dot matches any character and so also denies "/xgit" and the like. That is
# harmless in practice -- no such directory exists -- but there is no reason to
# copy it.
<DirectoryMatch "/\.git">
  Require all denied
</DirectoryMatch>

# ---------------------------------------------------------------------------
# Per-directory configuration files
# ---------------------------------------------------------------------------

AccessFileName .htaccess

# Serve no .htaccess file as content, ever.
<Files ~ "^\.ht">
  Require all denied
</Files>

# mod_dir needs to be told what to serve for a directory URL. Production also
# lists index.php and the CGI variants; nothing under ids/ uses them, and PHP
# is out of scope for local testing.
DirectoryIndex index.html index.htm

# ---------------------------------------------------------------------------
# Connection handling
# ---------------------------------------------------------------------------

# Matches production. The short keepalive suits a service whose typical client
# makes one request and follows the redirect elsewhere.
Timeout 30
KeepAlive On
MaxKeepAliveRequests 10
KeepAliveTimeout 1
