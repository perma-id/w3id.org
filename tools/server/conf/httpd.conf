# Container wrapper: upstream Apache layout (/usr/local/apache2).
#
# This file replaces the stock httpd.conf in the official httpd:2.4 image. It
# supplies only what is specific to that layout -- server root, modules,
# listener, logging -- and then includes conf/w3id.conf, which holds the
# actual w3id.org behaviour and is shared with the native Debian path.
#
# Do not put behaviour here. If a directive would also be true of the live
# server, it belongs in w3id.conf.

ServerRoot "/usr/local/apache2"

Listen 80

# Silences the startup warning about determining the FQDN. The name is never
# used to build a redirect: every redirect the service issues comes from an
# .htaccess and names an absolute target.
ServerName localhost

# ---------------------------------------------------------------------------
# Modules
# ---------------------------------------------------------------------------
#
# This list is deliberately EXACTLY the set the live server enables, minus the
# pieces that are out of scope locally (see the omissions below). The official
# image is built with --enable-mods-shared=reallyall, so every module exists
# on disk as a .so and this file alone decides what loads.
#
# That restriction is the point. A contributor who reaches for a directive
# from a module production does not run gets a 500 here, at the moment they
# write it, instead of a working local test and a broken deployment. Adding a
# LoadModule line to make your own .htaccess work is therefore the wrong fix:
# the live server will not have it.
#
# Deliberately NOT loaded:
#   proxy, proxy_fcgi   nothing here is proxied or handed to an application
#   ssl, socache_shmcb  no TLS by default; see the guide's TLS section
#   auth_basic, authn_file, authz_user
#                       nothing in the service authenticates anyone
#   status              an operational endpoint, not part of resolving an id

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so

# logio provides %O -- bytes actually sent, including headers -- which the
# `combined` LogFormat below uses. It is absent from the live server's
# mods-enabled directory and still works there, because Debian links
# mod_logio into the apache2 binary statically and so ships no .load file for
# it. The official image builds every module shared, so here it must be asked
# for by name. Without it httpd refuses to start: "Unrecognized LogFormat
# directive %O".
LoadModule logio_module modules/mod_logio.so

# Authorization. authz_core provides Require. access_compat accepts the older
# `Order`/`Allow`/`Deny` spelling, which a small number of .htaccess files
# still use -- without it those directories would return 500 here while
# continuing to work on a deployed server.
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so

# The modules that actually resolve identifiers.
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule env_module modules/mod_env.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so

# Loaded because production's document root sets Indexes and MultiViews.
# Without these two, those Options would silently do nothing and the local
# server would disagree with the live one.
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule negotiation_module modules/mod_negotiation.so

# Also enabled live.
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so

# ---------------------------------------------------------------------------
# Process identity
# ---------------------------------------------------------------------------

User daemon
Group daemon

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
#
# Both streams go to the container's stdout/stderr so `docker compose logs`
# shows them. This matters more here than in production: when an .htaccess has
# a syntax error, the error log is the only thing that names the file and the
# line, and a contributor staring at a 500 needs to find it immediately.

ErrorLog /proc/self/fd/2
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# ---------------------------------------------------------------------------
# MIME types
# ---------------------------------------------------------------------------

TypesConfig conf/mime.types

# ---------------------------------------------------------------------------
# Shared w3id.org behaviour
# ---------------------------------------------------------------------------

Define W3ID_DOCROOT /usr/local/apache2/htdocs

Include conf/w3id.conf
