# Rootless wrapper: an Apache the invoking user built and runs as themselves.
#
# This file supplies only what is specific to that arrangement -- server root,
# module paths, listener, runtime state, logging -- and then includes
# conf/w3id.conf, which holds the actual w3id.org behaviour and is shared with
# the container and native Debian paths.
#
# Do not put behaviour here. If a directive would also be true of the live
# server, it belongs in w3id.conf.
#
# Nothing in this file is specific to a machine. Every path and the port
# arrive as Defines on the command line, which bin/run-server works out and
# passes; run it rather than invoking httpd directly. `run-server test` prints
# the full invocation if you want to see it.

ServerRoot "${W3ID_SERVERROOT}"

Listen ${W3ID_PORT}

# Silences the startup warning about determining the FQDN. The name is never
# used to build a redirect: every redirect the service issues comes from an
# .htaccess and names an absolute target.
ServerName localhost

# ---------------------------------------------------------------------------
# Modules
# ---------------------------------------------------------------------------
#
# The same set, in the same order, as conf/httpd.conf -- see that file for why
# each is here and what is deliberately left out. Two things differ.
#
# The directory is a Define, because it is the prefix bin/build-httpd
# installed into on one machine and a distribution's module directory on
# another.
#
# Each line is guarded. bin/build-httpd produces these as shared objects, so
# the guards do nothing there. A distribution Apache links several of them
# into the binary instead, and loading a built-in module again is a fatal
# error -- the guard is what lets this file work with a system httpd at all.
#
# Note what the guards cost: with a system Apache the restriction stops being
# enforced, because a module compiled into the binary is present whether this
# file asks for it or not. That is the same caveat conf/docker-direct.conf
# carries, and it is why bin/run-server prefers a built httpd and needs
# W3ID_ALLOW_SYSTEM_HTTPD before it will use a system one.

<IfModule !mpm_event_module>
LoadModule mpm_event_module "${W3ID_MODDIR}/mod_mpm_event.so"
</IfModule>
<IfModule !unixd_module>
LoadModule unixd_module "${W3ID_MODDIR}/mod_unixd.so"
</IfModule>
<IfModule !log_config_module>
LoadModule log_config_module "${W3ID_MODDIR}/mod_log_config.so"
</IfModule>

# logio provides %O, which the `combined` LogFormat below uses. Without it
# httpd refuses to start: "Unrecognized LogFormat directive %O". Debian links
# it statically, which is exactly the case the guard is here for.
<IfModule !logio_module>
LoadModule logio_module "${W3ID_MODDIR}/mod_logio.so"
</IfModule>

<IfModule !authn_core_module>
LoadModule authn_core_module "${W3ID_MODDIR}/mod_authn_core.so"
</IfModule>
<IfModule !authz_core_module>
LoadModule authz_core_module "${W3ID_MODDIR}/mod_authz_core.so"
</IfModule>
<IfModule !authz_host_module>
LoadModule authz_host_module "${W3ID_MODDIR}/mod_authz_host.so"
</IfModule>
<IfModule !access_compat_module>
LoadModule access_compat_module "${W3ID_MODDIR}/mod_access_compat.so"
</IfModule>

<IfModule !rewrite_module>
LoadModule rewrite_module "${W3ID_MODDIR}/mod_rewrite.so"
</IfModule>
<IfModule !alias_module>
LoadModule alias_module "${W3ID_MODDIR}/mod_alias.so"
</IfModule>
<IfModule !headers_module>
LoadModule headers_module "${W3ID_MODDIR}/mod_headers.so"
</IfModule>
<IfModule !setenvif_module>
LoadModule setenvif_module "${W3ID_MODDIR}/mod_setenvif.so"
</IfModule>
<IfModule !env_module>
LoadModule env_module "${W3ID_MODDIR}/mod_env.so"
</IfModule>
<IfModule !mime_module>
LoadModule mime_module "${W3ID_MODDIR}/mod_mime.so"
</IfModule>
<IfModule !dir_module>
LoadModule dir_module "${W3ID_MODDIR}/mod_dir.so"
</IfModule>

<IfModule !autoindex_module>
LoadModule autoindex_module "${W3ID_MODDIR}/mod_autoindex.so"
</IfModule>
<IfModule !negotiation_module>
LoadModule negotiation_module "${W3ID_MODDIR}/mod_negotiation.so"
</IfModule>

<IfModule !deflate_module>
LoadModule deflate_module "${W3ID_MODDIR}/mod_deflate.so"
</IfModule>
<IfModule !filter_module>
LoadModule filter_module "${W3ID_MODDIR}/mod_filter.so"
</IfModule>
<IfModule !reqtimeout_module>
LoadModule reqtimeout_module "${W3ID_MODDIR}/mod_reqtimeout.so"
</IfModule>

# ---------------------------------------------------------------------------
# Process identity
# ---------------------------------------------------------------------------
#
# There is deliberately no User or Group here, unlike conf/httpd.conf. Both
# only do anything when the parent process starts as root and drops privilege;
# an httpd started by an ordinary user already runs as that user and cannot
# become anyone else. Setting them would produce a startup warning and change
# nothing.
#
# Their absence is also why the native path's "403 on every URL" failure does
# not arise here: the process is you, so a checkout under your home directory
# is readable without granting anything to a service account.

# ---------------------------------------------------------------------------
# Runtime state
# ---------------------------------------------------------------------------
#
# conf/httpd.conf sets none of this, because the container's ServerRoot is
# writable and the defaults land inside it. Here ServerRoot may be a read-only
# system directory, and the defaults would be unwritable, so the pid file and
# the scoreboard are pointed somewhere the user owns.

PidFile "${W3ID_RUNDIR}/httpd.pid"
DefaultRuntimeDir "${W3ID_RUNDIR}"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
#
# Real files rather than the container's /proc/self/fd/{1,2}, so that a server
# started with `run-server start` leaves something to read after the terminal
# that launched it has gone. `run-server status` prints these paths.
#
# When an .htaccess has a syntax error the error log is the only thing that
# names the file and the line, so it is the first place to look at a 500.

ErrorLog "${W3ID_LOGDIR}/error.log"
LogLevel warn

LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog "${W3ID_LOGDIR}/access.log" combined

# ---------------------------------------------------------------------------
# MIME types
# ---------------------------------------------------------------------------
#
# A Define rather than conf/mime.types relative to ServerRoot: that path holds
# for a built prefix, but a distribution keeps the file somewhere else.

TypesConfig "${W3ID_MIMETYPES}"

# ---------------------------------------------------------------------------
# Shared w3id.org behaviour
# ---------------------------------------------------------------------------
#
# W3ID_DOCROOT is the contract conf/w3id.conf expects: the absolute path of
# the repository's ids/ directory.

Include "${W3ID_REPO}/tools/server/conf/w3id.conf"
