# zizmor configuration: https://docs.zizmor.sh/configuration/
#
# Kept deliberately small. Every entry states a policy this repository holds
# itself to, so each one needs a reason.

rules:
  # Actions must be pinned to a full commit SHA, never a tag. A tag can be
  # moved to point at different code after it is reviewed; a SHA cannot. The
  # comment alongside each pin records which release that SHA is, so the
  # version is still readable and an out-of-date pin is still obvious.
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
